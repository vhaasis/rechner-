name: News aktualisieren

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "*/15 5-22 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "all = News und Kurse, quotes = nur Kurse"
        type: choice
        options: [all, quotes]
        default: all
  push:
    branches: [main, claude/stock-news-website-s6ypt7]
    paths:
      - stocks.js
      - scripts/**
      - .github/workflows/update-news.yml

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

env:
  MODE: ${{ github.event.schedule == '*/15 5-22 * * 1-5' && 'quotes' || github.event.inputs.mode || 'all' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vorhandene Daten laden
        run: |
          git clone --depth 1 --branch news-data "https://github.com/${GITHUB_REPOSITORY}.git" out 2>/dev/null || mkdir -p out
          rm -rf out/.git

      - name: News abrufen
        if: env.MODE != 'quotes'
        run: node scripts/fetch-news.mjs out

      - name: Kurse abrufen
        continue-on-error: true
        run: node scripts/fetch-quotes.mjs out

      - name: Auf news-data veröffentlichen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b news-data
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Stand $(date -u +%Y-%m-%dT%H:%MZ) ($MODE)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" news-data
